<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>소개페이지</title>
    <link rel="stylesheet" href="./profile.css" />
  </head>
  <body>
    <div class="profile-container">
      <div class="profile-card">
        <img
          src="./profile.png"
          alt="차은우 사진입니다. 잘생겼어요."
          class="profile-pic"
          id="image"
        />
        <h1 id="name">차은우</h1>
        <p id="intro">
          저는 멋지고 기능적인 웹사이트를 만드는데 열정을 가진 웹개발자입니다.
          저는 코딩, 커피, 야외 활동을 좋아합니다.
        </p>
        <h2>보유기술</h2>
        <ul id="skills">
          <li class="card">HTML</li>
          <li class="card">CSS</li>
          <li class="card">Javascript</li>
          <li class="card">Typescript</li>
          <li class="card">React.js</li>
          <li class="card">Next.js</li>
        </ul>
        <button id="update-button">Update Info</button>
      </div>
    </div>
  </body>
</html>
