<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>자기소개 페이지</title>
    <link rel="stylesheet" href="intro.css" />
  </head>
  <body>
    <!-- header -->
    <header>
      <h1>안녕하세요, 제 이름은 양금명입니다.</h1>

      <nav>
        <ul>
          <li><a href="#intro">소개</a></li>
          <li><a href="#skills">기술</a></li>
          <li><a href="#contact">연락처</a></li>
        </ul>
      </nav>
    </header>

    <!-- 전체 영역 -->
    <div class="layout">
      <!-- aside -->
      <aside>
        <h2>추천 링크</h2>
        <ul>
          <li>
            <a href="https://developer.mozilla.org" target="_blank"
              >MDN Web Docs</a
            >
          </li>
          <li><a href="https://w3schools.com" target="_blank">W3Schools</a></li>
          <li>
            <a href="https://frontendmasters.com" target="_blank"
              >Frontend Masters</a
            >
          </li>
        </ul>
      </aside>

      <!-- main -->
      <main>
        <!-- 소개 -->
        <section id="intro">
          <h2>소개</h2>
          <p>저는 웹 프론트엔드 개발자를 꿈꾸는 예비 개발자입니다.</p>
        </section>

        <!-- 기술 -->
        <section id="skills">
          <h2>기술</h2>
          <ul class="skills-list">
            <li>HTML</li>
            <li>CSS</li>
            <li>JavaScript</li>
          </ul>
        </section>

        <!-- 연락처 -->
        <section id="contact">
          <h2>연락처</h2>
          <form>
            <label
              >이름:
              <input type="text" name="name" />
            </label>

            <label
              >이메일:
              <input type="email" name="email" />
            </label>

            <label
              >메시지:
              <textarea name="message"></textarea>
            </label>

            <button type="submit">보내기</button>
          </form>
        </section>
      </main>
    </div>

    <!-- footer -->
    <footer>
      <p>© 2025 양금명. 모든 권리 보유.</p>
    </footer>
  </body>
</html>
